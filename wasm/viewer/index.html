<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMotics Viewer (wasm)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2323272e'/><circle cx='8' cy='8' r='4' fill='%2338d96b'/></svg>" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #1a1d21; color: #e6e6e6; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 8px 14px; background: #23272e; border-bottom: 1px solid #11141a; font-size: 13px;
    }
    #toolbar label { color: #9aa0a6; }
    #toolbar select, #toolbar input[type=file] { background: #2e333b; color: #e6e6e6;
      border: 1px solid #3a4049; border-radius: 4px; padding: 4px 6px; font-size: 13px; }
    #toolbar .sep { width: 1px; height: 20px; background: #3a4049; }
    #toolbar .toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    #status { margin-left: auto; color: #8ab4f8; font-family: ui-monospace, monospace; min-width: 220px; text-align: right; }
    #status.err { color: #ff6b6b; }

    #main { flex: 1 1 auto; display: flex; min-height: 0; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; }
    #gl { display: block; width: 100%; height: 100%; }
    #drop-hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(56,217,107,0.10); border: 2px dashed #38d96b; color: #c7f5d8;
      font-size: 22px; pointer-events: none; }
    #canvas-wrap.dragging #drop-hint { display: flex; }

    #dashboard { flex: 0 0 260px; width: 260px; background: #23272e; color: #e6e6e6;
      border-left: 1px solid #11141a; padding: 16px; overflow-y: auto; }
    #dashboard h2 { margin: 0 0 12px; font-size: 14px; letter-spacing: 1px;
      text-transform: uppercase; color: #8ab4f8; }
    .row { display: flex; justify-content: space-between; align-items: baseline;
      padding: 7px 0; border-bottom: 1px solid #2e333b; font-size: 13px; }
    .row .label { color: #9aa0a6; }
    .row .value { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #e6e6e6; text-align: right; }
    .legend { margin-top: 14px; font-size: 12px; color: #9aa0a6; }
    .legend .chip { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    .chip.cut { background: #38d96b; } .chip.rapid { background: #ff5c5c; } .chip.geom { background: #9aa0a6; }

    #timeline-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: #23272e; border-top: 1px solid #11141a; }
    #play { width: 44px; padding: 6px 0; cursor: pointer; background: #3b82f6; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; }
    #play:hover { background: #2f6fe0; }
    #timeline { flex: 1 1 auto; }
    #time-readout { font-family: ui-monospace, monospace; font-size: 13px; min-width: 130px; text-align: right; color: #9aa0a6; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
  </script>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <label for="examples">Example</label>
      <select id="examples"></select>
      <span class="sep"></span>
      <label for="file">Open</label>
      <input type="file" id="file" accept=".nc,.ngc,.gcode,.tap,.txt" />
      <span class="sep"></span>
      <label for="resolution">Resolution</label>
      <select id="resolution">
        <option value="1">Low</option>
        <option value="2" selected>Medium</option>
        <option value="3">High</option>
      </select>
      <span class="sep"></span>
      <label class="toggle"><input type="checkbox" id="show-geom" checked /> Geometry</label>
      <label class="toggle"><input type="checkbox" id="show-path" checked /> Path</label>
      <span id="status">loading…</span>
    </div>

    <div id="main">
      <div id="canvas-wrap">
        <canvas id="gl"></canvas>
        <div id="drop-hint">Drop a G-code file to simulate</div>
      </div>
      <div id="dashboard">
        <h2>Simulation</h2>
        <div class="row"><span class="label">Tool</span><span class="value" id="dash-tool">--</span></div>
        <div class="row"><span class="label">Diameter</span><span class="value" id="dash-diameter">--</span></div>
        <div class="row"><span class="label">Feed</span><span class="value" id="dash-feed">--</span></div>
        <div class="row"><span class="label">Speed</span><span class="value" id="dash-speed">--</span></div>
        <div class="row"><span class="label">Position X</span><span class="value" id="dash-x">--</span></div>
        <div class="row"><span class="label">Position Y</span><span class="value" id="dash-y">--</span></div>
        <div class="row"><span class="label">Position Z</span><span class="value" id="dash-z">--</span></div>
        <div class="row"><span class="label">Time</span><span class="value" id="dash-time">--</span></div>
        <div class="row"><span class="label">Triangles</span><span class="value" id="dash-tris">--</span></div>
        <div class="legend">
          <div><span class="chip geom"></span>Cut geometry</div>
          <div><span class="chip cut"></span>Cut move</div>
          <div><span class="chip rapid"></span>Rapid move</div>
        </div>
      </div>
    </div>

    <div id="timeline-bar">
      <button id="play">Play</button>
      <input type="range" id="timeline" min="0" max="1" step="0.001" value="0" />
      <span id="time-readout">0.000 / 0.000 s</span>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
